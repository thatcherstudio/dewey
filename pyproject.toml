[project]
name = "dewey"
version = "0.1.0"
description = "Catalog a folder, recommend an organization with rules + a local decision model, move with an undoable journal."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []          # core is stdlib-only

[project.optional-dependencies]
pdf = ["pypdf>=4"]
photos = ["Pillow>=10", "pillow-heif>=0.16"]
fast = ["blake3>=0.4"]
all = ["pypdf>=4", "Pillow>=10", "pillow-heif>=0.16", "blake3>=0.4"]

[project.urls]
Homepage = "https://github.com/thatcherstudio/dewey"
Repository = "https://github.com/thatcherstudio/dewey"
Issues = "https://github.com/thatcherstudio/dewey/issues"

[project.scripts]
dewey = "dewey.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dewey"]
